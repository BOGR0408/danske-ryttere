<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Danske ryttere</title>
<meta name="theme-color" content="#1f6b3e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="ikon-192.png">
<link rel="apple-touch-icon" href="ikon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ryttere">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
/* Farver fra ejerens billede: mørkegrøn, lysegrøn, mint, blågrå, mørkeblå, lilla */
:root{
  --bg:#f3f8f5; --panel:#ffffff; --tekst:#1b2d52; --svag:#5a6b87; --linje:#dce5ec; --kant:#a3b8cc;
  --top:#1f6b3e; --top-svag:#d6ede0;
  --roed:#1f6b3e; --roed-svag:#e8f5ee; --guld:#1b2d52; --guld-bg:#2bb673; --soelv-bg:#e8f5ee; --bronze-bg:#e8f5ee;
  --chip:#ffffff; --chip-tekst:#1b2d52; --valgt:#1b2d52; --valgt-tekst:#ffffff; --lilla:#3a1f4a;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1a16; --panel:#16241e; --tekst:#e6eef5; --svag:#a3b8cc; --linje:#24362e; --kant:#3a5266;
    --top:#174f2e; --top-svag:#c3e3d0;
    --roed:#2bb673; --roed-svag:#173a29; --guld:#0f1a16; --guld-bg:#2bb673; --soelv-bg:#173a29; --bronze-bg:#173a29;
    --chip:#1c2d26; --chip-tekst:#e6eef5; --valgt:#2bb673; --valgt-tekst:#0f1a16; --lilla:#c9a6da;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tekst);font:15px/1.45 Montserrat,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--bg);position:sticky;top:0;z-index:5}
/* Grøn top i fuld bredde */
.top,nav{background:var(--top);box-shadow:0 0 0 100vmax var(--top);clip-path:inset(0 -100vmax)}
.stribe{height:5px;display:grid;grid-template-columns:repeat(6,1fr)}
.stribe i:nth-child(1){background:#1f6b3e}.stribe i:nth-child(2){background:#2bb673}.stribe i:nth-child(3){background:#e8f5ee}
.stribe i:nth-child(4){background:#a3b8cc}.stribe i:nth-child(5){background:#1b2d52}.stribe i:nth-child(6){background:#3a1f4a}
.kilde{font-size:12px;color:var(--svag);margin:24px 0 8px}
.top{max-width:1200px;margin:0 auto;padding:16px 16px 4px;display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;color:#fff}
h1{font-size:22px;margin:0;display:flex;align-items:center;gap:10px;font-weight:500}
h1 b{font-weight:800}
.flag{display:inline-block;width:26px;height:18px;border-radius:3px;background:
  linear-gradient(90deg,transparent 8px,#fff 8px,#fff 12px,transparent 12px),
  linear-gradient(0deg,transparent 7px,#fff 7px,#fff 11px,transparent 11px),#c8102e}
.opd{color:var(--top-svag);font-size:13px}
nav{max-width:1200px;margin:0 auto;padding:8px 16px 0;display:flex;gap:4px;overflow-x:auto}
nav a{padding:10px 16px;color:#fff;text-decoration:none;border-radius:10px 10px 0 0;white-space:nowrap;font-weight:600}
nav a:hover{background:rgba(255,255,255,.12)}
nav a.aktiv{color:var(--roed);background:var(--bg);font-weight:700}
main{max-width:1200px;margin:0 auto;padding:16px}
.fast{max-width:1200px;margin:0 auto;padding:10px 16px 0}
.fast .panel{margin-bottom:10px;padding:10px 14px}
.fast:empty,#filterslot:empty{display:none}
header{box-shadow:0 2px 8px rgba(27,45,82,.08)}
.panel{background:var(--panel);border:1px solid var(--linje);border-radius:14px;padding:14px;margin-bottom:14px}
.filtre{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.filtre label{display:flex;flex-direction:column;font-size:12px;color:var(--svag);gap:3px;font-weight:600}
select,input[type=search]{font:inherit;font-size:14px;font-weight:500;padding:7px 9px;border:1.5px solid var(--kant);border-radius:8px;background:var(--panel);color:var(--tekst);min-width:150px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{border:1.5px solid var(--kant);background:var(--chip);color:var(--chip-tekst);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600;cursor:pointer;user-select:none}
.chip.valgt{background:var(--valgt);border-color:var(--valgt);color:var(--valgt-tekst)}
.chip .n{opacity:.7;margin-left:4px;font-size:12px}
.holdhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.holdhead b{font-size:13px}
.lnk{background:none;border:0;color:var(--roed);cursor:pointer;font:inherit;font-size:13px;padding:0}
.tael{color:var(--svag);font-size:13px;margin:4px 2px 8px}
.tabel{width:100%;border-collapse:collapse;font-size:14px}
.tabel th{text-align:left;font-size:12px;color:var(--svag);font-weight:600;padding:8px;border-bottom:1px solid var(--linje);white-space:nowrap}
.tabel td{padding:7px 8px;border-bottom:1px solid var(--linje);vertical-align:top}
.tabel tr:last-child td{border-bottom:0}
.tabel .num{text-align:right;white-space:nowrap}
.plac{display:inline-block;min-width:34px;text-align:center;border-radius:8px;padding:2px 6px;font-weight:800;font-variant-numeric:tabular-nums}
.p1{background:var(--guld-bg);color:var(--guld);display:inline-flex;align-items:center;justify-content:center;gap:3px}
.medalje{width:15px;height:18px;flex:none}
.p2{background:var(--soelv-bg);color:var(--roed)}
.p3{background:var(--bronze-bg);color:var(--roed)}
.top10{background:var(--roed-svag);color:var(--roed)}
.ude{color:var(--svag);font-weight:400}
.dato{white-space:nowrap;color:var(--svag);font-variant-numeric:tabular-nums}
.kl{font-size:11px;border:1px solid var(--linje);border-radius:4px;padding:0 4px;color:var(--svag);margin-left:4px;white-space:nowrap}
a.r{color:inherit;text-decoration:none;font-weight:500}
a.r:hover{color:var(--roed)}
.svag{color:var(--svag)}
.ryd{font:inherit;font-size:14px;font-weight:600;padding:6px 12px;border-radius:8px;border:1.5px solid var(--lilla);background:transparent;color:var(--lilla);cursor:pointer;margin-left:auto}
.ryd:hover{background:var(--lilla);color:var(--panel)}
.mere{display:block;margin:12px auto 0;padding:8px 16px;border-radius:6px;border:1px solid var(--linje);background:var(--panel);color:var(--tekst);cursor:pointer;font:inherit}
.kort{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.rk{background:var(--panel);border:1px solid var(--linje);border-radius:10px;padding:12px 14px;text-decoration:none;color:inherit;display:block}
.rk:hover{border-color:var(--roed)}
.rk h3{margin:0 0 2px;font-size:16px}
.rk .hold{color:var(--svag);font-size:13px}
.tal{display:flex;gap:16px;margin-top:10px}
.tal div{display:flex;flex-direction:column;font-size:11px;color:var(--svag)}
.tal b{font-size:18px;color:var(--tekst);font-variant-numeric:tabular-nums}
.profilhead{display:flex;justify-content:space-between;align-items:start;gap:12px;flex-wrap:wrap}
.profilhead h2{margin:0;font-size:24px}
.tom{padding:24px;text-align:center;color:var(--svag)}
.note{font-size:13px;color:var(--svag);margin:0 0 10px}
.navne{display:flex;flex-wrap:wrap;gap:4px 10px}
.skjul-mobil{}
.kun-mobil{display:none}
.filterknap{display:none}
@media (max-width:700px){
  body{font-size:16px}
  .top{padding:10px 16px 0}
  h1{font-size:18px}
  .top{align-items:center;row-gap:2px}
  .opd{font-size:12px;flex-basis:100%;order:3}
  nav a{font-size:15px}
  nav{align-items:center}
  nav a{padding:10px 10px}
  /* Filtre gemmes bag en knap på telefonen */
  .filterknap{display:inline-flex;align-items:center;gap:6px;margin-left:auto;font:inherit;font-size:14px;padding:6px 12px;
    border-radius:999px;border:0;background:#2bb673;color:#1b2d52;font-weight:700;cursor:pointer;white-space:nowrap;min-height:38px}
  .filterknap .antal{background:#1b2d52;color:#fff;border-radius:999px;font-size:12px;padding:0 7px}
  .fast{display:none;max-height:70vh;overflow-y:auto;padding:8px 12px 0}
  header.aaben .fast{display:block}
  .chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
  .chip{white-space:nowrap;padding:7px 12px;font-size:14px}
  .skjul-mobil,.tabel td.skjul-mobil{display:none}
  .kun-mobil{display:inline}
  main{padding:12px}
  select,input[type=search]{min-width:0;width:100%;font-size:16px;padding:9px 8px}
  .filtre label{flex:1 1 140px}
  .ryd{margin-left:0;width:100%;padding:10px}
  /* Tabeller bliver til kort */
  .tabel thead{display:none}
  .tabel, .tabel tbody{display:block}
  .tabel tr{display:grid;grid-template-columns:1fr auto;column-gap:10px;padding:11px 8px;border-bottom:1px solid var(--linje)}
  .tabel tr:last-child{border-bottom:0}
  .tabel td{display:block;padding:0;border:0}
  .tabel td.num{grid-column:2;grid-row:1 / span 3;align-self:center}
  .tabel td.dato{font-size:13px}
  .res td.c-rytter{grid-row:1;font-size:16px}
  .res td.c-loeb{grid-row:2}
  .res td.c-dato{grid-row:3}
  .prof td.c-loeb{grid-row:1}
  .prof td.c-dato{grid-row:2}
  .komm tr{grid-template-columns:1fr}
  .komm td.c-navne{margin-top:4px;font-size:14px}
  .plac{min-width:40px;font-size:16px;padding:4px 8px}
  .kort{grid-template-columns:1fr}
  .profilhead h2{font-size:21px}
  .tal{gap:14px !important;flex-wrap:wrap}
}
</style>
</head>
<body>
<header>
  <div class="top"><h1><span class="flag"></span><span><b>Danske</b> ryttere</span></h1><button class="filterknap" id="filterknap" type="button">Filtre</button><span class="opd" id="opd"></span></div>
  <nav>
    <a href="#resultater" data-v="resultater">Resultater</a>
    <a href="#kommende" data-v="kommende">Kommende løb</a>
    <a href="#ryttere" data-v="ryttere">Ryttere</a>
  </nav>
  <div class="stribe" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="fast">
    <section class="panel" id="holdpanel">
      <div class="holdhead"><b>Hold</b><span><button class="lnk" id="alleHold">Vis alle hold</button></span></div>
      <div class="chips" id="holdchips"></div>
    </section>
    <div id="filterslot"></div>
  </div>
</header>
<main>
  <div id="visning"></div>
  <p class="kilde">Kilde: UCI DataRide</p>
</main>

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const MDR = ["jan.","feb.","mar.","apr.","maj","jun.","jul.","aug.","sep.","okt.","nov.","dec."];
const fDato = iso => { if(!iso) return ""; const [y,m,d] = iso.split("-"); return `${+d}. ${MDR[+m-1]} ${y}`; };
const fKort = iso => { if(!iso) return ""; const [,m,d] = iso.split("-"); return `${+d}. ${MDR[+m-1]}`; };
const alder = f => { if(!f) return ""; const b=new Date(f), n=new Date(D.idag); let a=n.getFullYear()-b.getFullYear(); if(n<new Date(n.getFullYear(),b.getMonth(),b.getDate())) a--; return a; };
const lager = { get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } },
                set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} } };

// ---- opdateret
if (D.opdateret) { const [d,t] = D.opdateret.split("T"); $("#opd").textContent = `Opdateret ${fDato(d)} kl. ${t}`; }
else $("#opd").textContent = "Endnu ikke opdateret";

// ---- sæsoner
const saesonTal = {}; D.resultater.forEach(r => saesonTal[r.s] = (saesonTal[r.s]||0)+1);
const saesoner = Object.keys(saesonTal).map(Number).sort((a,b)=>b-a);
const stdSaeson = saesoner.find(s => saesonTal[s] >= 50) ?? saesoner[0];
const tilstand = { saeson: stdSaeson, rytter:"", loeb:"", plac:"", type:"", klasse:"", vis:200, kunSidst:true, kKlasse:"" };

// ---- holdfilter (huskes i browseren)
let valgteHold = new Set(lager.get("valgteHold", []).filter(h => D.hold.includes(h)));
function holdOk(h){ return valgteHold.size===0 || valgteHold.has(h); }
function tegnChips(){
  const antal = {}; Object.values(D.ryttere).forEach(r => antal[r.hold]=(antal[r.hold]||0)+1);
  const liste = D.hold.filter(h => antal[h]).sort((a,b)=>(antal[b]-antal[a])||a.localeCompare(b));
  $("#holdchips").innerHTML = liste.map(h =>
    `<span class="chip ${valgteHold.has(h)?"valgt":""}" data-h="${esc(h)}" title="${esc(D.niveau[h]||"")}">${esc(h)}<span class="n">${antal[h]}</span></span>`).join("");
  $("#alleHold").style.visibility = valgteHold.size ? "visible" : "hidden";
}
$("#holdchips").addEventListener("click", e => {
  const c = e.target.closest(".chip"); if(!c) return;
  const h = c.dataset.h; valgteHold.has(h) ? valgteHold.delete(h) : valgteHold.add(h);
  lager.set("valgteHold", [...valgteHold]); tilstand.vis = 200; tegnChips(); vis();
});
$("#alleHold").onclick = () => { valgteHold.clear(); lager.set("valgteHold", []); tegnChips(); vis(); };
function rydFiltre(){
  Object.assign(tilstand, { saeson: stdSaeson, rytter:"", loeb:"", plac:"", type:"", klasse:"", vis:200, kKlasse:"", kunSidst:true });
  valgteHold.clear(); lager.set("valgteHold", []); tegnChips(); vis();
}
const rydKnap = `<button class="ryd" onclick="rydFiltre()">Ryd alle filtre</button>`;
// Telefon: filtre ligger bag en knap
$("#filterknap").onclick = () => document.querySelector("header").classList.toggle("aaben");
function opdaterFilterknap(){
  const n = valgteHold.size + ["rytter","loeb","plac","type","klasse","kKlasse"].filter(k => tilstand[k]).length
          + (tilstand.saeson !== stdSaeson ? 1 : 0);
  const k = $("#filterknap");
  k.innerHTML = `Filtre${n ? ` <span class="antal">${n}</span>` : ""}`;
  k.style.visibility = location.hash.startsWith("#rytter/") ? "hidden" : "visible";
}

// ---- hjælpere
const MEDALJE = `<svg class="medalje" viewBox="0 0 20 24" aria-hidden="true"><path d="M5 0h4l3 9H8z" fill="#c8102e"/><path d="M11 0h4l-3 9H8z" fill="#1b2d52"/><circle cx="10" cy="15" r="7.5" fill="#f2c230" stroke="#b8860b" stroke-width="1.5"/><path d="M10 10.8l1.3 2.6 2.8.4-2 2 .5 2.8-2.6-1.4-2.6 1.4.5-2.8-2-2 2.8-.4z" fill="#fff6c8"/></svg>`;
function placBadge(r){
  if (r.pn == null) return `<span class="plac ude">${esc(r.p)}</span>`;
  const k = r.pn===1?"p1":r.pn===2?"p2":r.pn===3?"p3":r.pn<=10?"top10":"";
  if (r.pn===1) return `<span class="plac p1" title="Sejr">${MEDALJE}1</span>`;
  return `<span class="plac ${k}">${r.pn}</span>`;
}
const rytterLink = id => `<a class="r" href="#rytter/${encodeURIComponent(id)}">${esc(D.ryttere[id]?.navn||id)}</a>`;
const klasseGruppe = kl => {
  kl = kl||"";
  if (/UWT/.test(kl)) return "UWT"; if (/Pro/.test(kl)) return "Pro";
  if (/^[12]\.1$/.test(kl)) return "1"; if (/^[12]\.2/.test(kl)) return "2";
  if (/^(CN|CC|CM|WC|JO|OG|CRT)/i.test(kl) || !/^[12]\./.test(kl)) return "M";
  return "andet";
};
const KLASSER = [["","Alle klasser"],["UWT","WorldTour"],["Pro","ProSeries"],["1","Klasse 1"],["2","Klasse 2"],["M","Mesterskaber m.m."]];
const opt = (liste, v) => liste.map(([k,t]) => `<option value="${esc(k)}" ${String(k)===String(v)?"selected":""}>${esc(t)}</option>`).join("");
const flag = l => l ? `<span class="svag" style="font-size:12px">${esc(l)}</span>` : "";

function filtrerResultater(){
  return D.resultater.filter(r =>
    r.s === tilstand.saeson && holdOk(r.h) &&
    (!tilstand.rytter || r.r === tilstand.rytter) &&
    (!tilstand.loeb || String(r.k) === tilstand.loeb) &&
    (!tilstand.plac || (tilstand.plac==="3" ? (r.pn!=null && r.pn<=3)
                       : tilstand.plac==="10" ? (r.pn!=null && r.pn<=10)
                       : (r.pn==null || r.pn>10))) &&
    (!tilstand.klasse || klasseGruppe(r.kl) === tilstand.klasse) &&
    typeOk(r));
}
// Type: løbsresultat = endagsløb + samlet klassement i etapeløb
function typeOk(r){
  switch (tilstand.type) {
    case "loeb":  return r.t==="Endags" || r.t==="Samlet";
    case "etape": return r.t==="Etape";
    case "troeje":return r.t==="Point" || r.t==="Bjerg" || r.t==="Ungdom";
    default: return true;
  }
}
const TYPER = [["","Alle resultater"],["loeb","Løbsresultat (endagsløb + samlet)"],["etape","Etaper"],["troeje","Point-, bjerg- og ungdomskonkurrence"]];

// ---- visning: resultater
function visResultater(){
  const ryttereISaeson = [...new Set(D.resultater.filter(r=>r.s===tilstand.saeson && holdOk(r.h)).map(r=>r.r))]
      .sort((a,b)=>D.ryttere[a].navn.localeCompare(D.ryttere[b].navn));
  if (tilstand.rytter && !ryttereISaeson.includes(tilstand.rytter)) tilstand.rytter = "";
  // Løb i data for valgt sæson, hold og rytter – sorteret alfabetisk
  const loebMap = new Map();
  D.resultater.forEach(r => {
    if (r.s===tilstand.saeson && holdOk(r.h) && (!tilstand.rytter || r.r===tilstand.rytter) && !loebMap.has(String(r.k)))
      loebMap.set(String(r.k), r);
  });
  const loebListe = [...loebMap.values()].sort((a,b)=>a.kn.localeCompare(b.kn,"da") || a.d.localeCompare(b.d));
  if (tilstand.loeb && !loebMap.has(tilstand.loeb)) tilstand.loeb = "";
  const res = filtrerResultater();
  const vist = res.slice(0, tilstand.vis);
  $("#visning").innerHTML = `
  <section class="panel filterpanel">
    <div class="filtre">
      <label>Sæson<select id="fSaeson">${opt(saesoner.map(s=>[s,s]), tilstand.saeson)}</select></label>
      <label>Rytter<select id="fRytter">${opt([["","Alle ryttere"],...ryttereISaeson.map(id=>[id,D.ryttere[id].navn])], tilstand.rytter)}</select></label>
      <label>Løb<select id="fLoeb">${opt([["",`Alle løb (${loebListe.length})`],...loebListe.map(r=>[r.k,`${r.kn} (${r.kl})`])], tilstand.loeb)}</select></label>
      <label>Placering<select id="fPlac">${opt([["","Alle placeringer"],["3","Top 3"],["10","Top 10 (1–10)"],["oevrige","Øvrige (11+ og udgået)"]], tilstand.plac)}</select></label>
      <label>Type<select id="fType">${opt(TYPER, tilstand.type)}</select></label>
      <label>Klasse<select id="fKlasse">${opt(KLASSER, tilstand.klasse)}</select></label>
      ${rydKnap}
    </div>
  </section>
  <div class="tael">${res.length.toLocaleString("da-DK")} resultater</div>
  <section class="panel" style="padding:4px 6px">
    ${res.length ? `<table class="tabel res">
      <thead><tr><th>Dato</th><th>Rytter</th><th class="skjul-mobil">Hold</th><th>Løb</th><th class="num">Plac.</th></tr></thead>
      <tbody>${vist.map(r=>`<tr>
        <td class="dato c-dato">${fKort(r.d)}</td>
        <td class="c-rytter">${rytterLink(r.r)}<span class="kun-mobil svag" style="font-size:13px"> · ${esc(r.h)}</span></td>
        <td class="skjul-mobil svag">${esc(r.h)}${r.hu?`<br><span style="font-size:12px">kørte for ${esc(r.hu)}</span>`:""}</td>
        <td class="c-loeb">${esc(r.kn)}<span class="kl">${esc(r.kl)}</span> ${flag(r.l)}<br><span class="svag">${esc(r.e)}</span></td>
        <td class="num">${placBadge(r)}</td></tr>`).join("")}</tbody></table>
      ${res.length>tilstand.vis?`<button class="mere" id="mere">Vis flere (${(res.length-tilstand.vis).toLocaleString("da-DK")} tilbage)</button>`:""}`
      : `<div class="tom">Ingen resultater med de valgte filtre.</div>`}
  </section>`;
  $("#fSaeson").onchange = e => { tilstand.saeson=+e.target.value; tilstand.vis=200; vis(); };
  $("#fRytter").onchange = e => { tilstand.rytter=e.target.value; tilstand.vis=200; vis(); };
  $("#fType").onchange = e => { tilstand.type=e.target.value; tilstand.vis=200; vis(); };
  $("#fKlasse").onchange = e => { tilstand.klasse=e.target.value; tilstand.vis=200; vis(); };
  $("#fPlac").onchange = e => { tilstand.plac=e.target.value; tilstand.vis=200; vis(); };
  $("#fLoeb").onchange = e => { tilstand.loeb=e.target.value; tilstand.vis=200; vis(); };
  if ($("#mere")) $("#mere").onclick = () => { tilstand.vis += 300; vis(); };
}

// ---- visning: kommende løb
function visKommende(){
  const liste = D.kommende.filter(k => {
    if (tilstand.kKlasse && klasseGruppe(k.kl)!==tilstand.kKlasse) return false;
    const navne = k.sidst.filter(id => holdOk(D.ryttere[id].hold));
    k._navne = navne;
    return !tilstand.kunSidst || navne.length;
  });
  $("#visning").innerHTML = `
  <p class="note">UCI offentliggør ikke startlister. Derfor vises de danskere, der kørte samme løb i sidste sæson, som et fingerpeg om, hvem der kan stille op.</p>
  <section class="panel filterpanel">
    <div class="filtre">
      <label>Klasse<select id="kKlasse">${opt(KLASSER, tilstand.kKlasse)}</select></label>
      <label style="flex-direction:row;align-items:center;gap:6px;font-size:14px;color:var(--tekst)"><input type="checkbox" id="kSidst" ${tilstand.kunSidst?"checked":""}> Kun løb med danskere sidst</label>
      ${rydKnap}
    </div>
  </section>
  <div class="tael">${liste.length} kommende løb (af ${D.kommende.length} i UCI's kalender)</div>
  <section class="panel" style="padding:4px 6px">
    ${liste.length ? `<table class="tabel komm"><thead><tr><th>Dato</th><th>Løb</th><th>Danskere sidst</th></tr></thead><tbody>
    ${liste.map(k=>`<tr><td class="dato">${fKort(k.start)}${k.slut!==k.start?` – ${fKort(k.slut)}`:""}</td>
      <td>${esc(k.navn)}<span class="kl">${esc(k.kl)}</span> ${flag(k.l)}</td>
      <td class="c-navne"><div class="navne">${k._navne.map(rytterLink).join("") || '<span class="svag">–</span>'}</div></td></tr>`).join("")}
    </tbody></table>` : `<div class="tom">${D.kommende.length ? "Ingen kommende løb med de valgte filtre." : "UCI har endnu ikke lagt kommende løb ud."}${tilstand.kunSidst&&D.kommende.length?' Prøv at slå "Kun løb med danskere sidst" fra.':""}</div>`}
  </section>`;
  $("#kKlasse").onchange = e => { tilstand.kKlasse=e.target.value; vis(); };
  $("#kSidst").onchange = e => { tilstand.kunSidst=e.target.checked; vis(); };
}

// ---- statistik pr. rytter
function stats(id, saeson){
  const rs = D.resultater.filter(r => r.r===id && r.s===saeson);
  const enkelt = rs.filter(r => r.t==="Etape"||r.t==="Endags"||r.t==="Samlet");
  return { rs, loeb: new Set(rs.map(r=>r.k)).size,
    sejre: enkelt.filter(r=>r.pn===1).length, top3: enkelt.filter(r=>r.pn&&r.pn<=3).length,
    top10: enkelt.filter(r=>r.pn&&r.pn<=10).length };
}

// ---- visning: ryttere
function visRyttere(){
  const ids = [...new Set(D.resultater.filter(r=>r.s===tilstand.saeson).map(r=>r.r))]
    .filter(id => holdOk(D.ryttere[id].hold));
  const kort = ids.map(id => ({id, ...D.ryttere[id], st: stats(id, tilstand.saeson)}))
    .sort((a,b)=> b.st.sejre-a.st.sejre || b.st.top10-a.st.top10 || a.navn.localeCompare(b.navn));
  $("#visning").innerHTML = `
  <section class="panel filterpanel"><div class="filtre">
    <label>Sæson<select id="fSaeson">${opt(saesoner.map(s=>[s,s]), tilstand.saeson)}</select></label>
    ${rydKnap}
  </div></section>
  <div class="tael">${kort.length} ryttere · sorteret efter sejre og top 10</div>
  <div class="kort">${kort.map(r=>`
    <a class="rk" href="#rytter/${encodeURIComponent(r.id)}">
      <h3>${esc(r.navn)}</h3><div class="hold">${esc(r.hold)} · ${alder(r.foedt)} år</div>
      <div class="tal"><div><b>${r.st.sejre}</b>sejre</div><div><b>${r.st.top3}</b>top 3</div><div><b>${r.st.top10}</b>top 10</div><div><b>${r.st.loeb}</b>løb</div></div>
    </a>`).join("") || '<div class="tom">Ingen ryttere med de valgte hold.</div>'}</div>`;
  $("#fSaeson").onchange = e => { tilstand.saeson=+e.target.value; vis(); };
}

// ---- visning: rytterprofil
function visProfil(id){
  const r = D.ryttere[id];
  if (!r) { $("#visning").innerHTML = '<div class="tom">Rytteren findes ikke.</div>'; return; }
  const egne = saesoner.filter(s => D.resultater.some(x=>x.r===id && x.s===s));
  const s = egne.includes(tilstand.saeson) ? tilstand.saeson : egne[0];
  const st = stats(id, s);
  const bedste = st.rs.filter(x=>x.pn && x.pn<=10).sort((a,b)=>a.pn-b.pn || b.d.localeCompare(a.d)).slice(0,10);
  const holdISaeson = [...new Set(st.rs.map(x=>x.h))];
  $("#visning").innerHTML = `
  <section class="panel">
    <div class="profilhead">
      <div><h2>${esc(r.navn)}</h2>
        <div class="svag">${esc(r.hold)}${r.niveau?` (${esc(r.niveau)})`:""} · født ${fDato(r.foedt)} · ${alder(r.foedt)} år</div>
        ${holdISaeson.length>1?`<div class="svag" style="font-size:13px">Hold i sæsonen: ${holdISaeson.map(esc).join(", ")}</div>`:""}</div>
      <label class="svag" style="font-size:12px;display:flex;flex-direction:column;gap:3px">Sæson<select id="pSaeson">${opt(egne.map(x=>[x,x]), s)}</select></label>
    </div>
    <div class="tal" style="gap:28px"><div><b>${st.sejre}</b>sejre</div><div><b>${st.top3}</b>top 3</div><div><b>${st.top10}</b>top 10</div><div><b>${st.loeb}</b>løb</div><div><b>${st.rs.length}</b>resultater</div></div>
  </section>
  ${bedste.length?`<section class="panel"><b style="font-size:14px">Bedste resultater</b>
    <table class="tabel prof" style="margin-top:6px"><tbody>${bedste.map(x=>`<tr><td class="num" style="width:50px">${placBadge(x)}</td>
      <td class="c-loeb">${esc(x.kn)}<span class="kl">${esc(x.kl)}</span><br><span class="svag">${esc(x.e)}</span></td><td class="dato c-dato">${fDato(x.d)}</td></tr>`).join("")}</tbody></table></section>`:""}
  <section class="panel"><div class="filtre">
    <label>Vis<select id="pType">${opt(TYPER, tilstand.type)}</select></label>
  </div></section>
  <section class="panel" style="padding:4px 6px">
    <table class="tabel prof"><thead><tr><th>Dato</th><th>Løb</th><th class="num">Plac.</th><th class="num skjul-mobil">Tid</th></tr></thead>
    <tbody>${st.rs.filter(typeOk).map(x=>`<tr><td class="dato c-dato">${fKort(x.d)}</td>
      <td class="c-loeb">${esc(x.kn)}<span class="kl">${esc(x.kl)}</span> ${flag(x.l)}<br><span class="svag">${esc(x.e)}</span></td>
      <td class="num">${placBadge(x)}</td><td class="num skjul-mobil svag">${esc(x.tid)}</td></tr>`).join("")}</tbody></table>
  </section>`;
  $("#pSaeson").onchange = e => { tilstand.saeson=+e.target.value; vis(); };
  $("#pType").onchange = e => { tilstand.type=e.target.value; vis(); };
}

// ---- routing
function vis(){
  const h = decodeURIComponent(location.hash.slice(1)) || "resultater";
  const v = h.startsWith("rytter/") ? "ryttere" : h;
  document.querySelectorAll("nav a").forEach(a => a.classList.toggle("aktiv", a.dataset.v===v));
  $("#holdpanel").style.display = h.startsWith("rytter/") ? "none" : "";
  $("#filterslot").replaceChildren(); // fjern den gamle filterlinje, før den nye tegnes
  if (h.startsWith("rytter/")) visProfil(h.slice(7));
  else if (h==="kommende") visKommende();
  else if (h==="ryttere") visRyttere();
  else visResultater();
  // Flyt filterlinjen op i den faste top, så den bliver stående ved scroll
  const fp = $("#visning .filterpanel");
  $("#filterslot").replaceChildren(...(fp ? [fp] : []));
  opdaterFilterknap();
}
window.addEventListener("hashchange", () => { document.querySelector("header").classList.remove("aaben"); vis(); window.scrollTo(0,0); });
tegnChips(); vis();
</script>
</body>
</html>
